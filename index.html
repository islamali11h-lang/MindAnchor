<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindAnchor AI</title>

<style>

body{
    margin:0;
    padding:0;
    background:#0d1117;
    color:white;
    font-family:Arial;
    height:100vh;
    display:flex;
}

/* =========================
SIDEBAR
========================= */

.sidebar{
    width:260px;
    background:#161b22;
    border-right:1px solid #333;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}

.sidebar-header{
    padding:15px;
    border-bottom:1px solid #333;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.sidebar-header h2{
    margin:0;
    font-size:20px;
}

.new-chat-btn{
    background:#238636;
    border:none;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.history-list{
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-item{
    background:#21262d;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
    line-height:1.5;
}

.history-item:hover{
    background:#30363d;
}

/* =========================
MAIN CHAT
========================= */

.main-chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    background:#161b22;
    padding:15px;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #333;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.msg{
    margin-bottom:15px;
}

.user{
    text-align:right;
}

.user .bubble{
    background:#238636;
    display:inline-block;
    padding:12px;
    border-radius:15px;
    max-width:70%;
}

.bot .bubble{
    background:#21262d;
    display:inline-block;
    padding:12px;
    border-radius:15px;
    max-width:70%;
}

.input-area{
    display:flex;
    padding:15px;
    background:#161b22;
    border-top:1px solid #333;
}

#user-input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#21262d;
    color:white;
}

.send-btn{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#238636;
    color:white;
    cursor:pointer;
}

.send-btn:hover{
    opacity:0.9;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="sidebar-header">

        <h2>💬 Chats</h2>

        <button class="new-chat-btn" onclick="newChat()">
            + New
        </button>

    </div>

    <div class="history-list" id="history-list"></div>

</div>

<!-- MAIN CHAT -->

<div class="main-chat">

    <div class="header">
        ⚓ MindAnchor AI
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">

        <input
        type="text"
        id="user-input"
        placeholder="Type your message..."
        >

        <button class="send-btn" onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

function addMessage(role, text){

    const messages = document.getElementById("messages")

    const div = document.createElement("div")

    div.className = "msg " + role

    div.innerHTML = `
        <div class="bubble">
            ${text}
        </div>
    `

    messages.appendChild(div)

    messages.scrollTop = messages.scrollHeight

}

function showTyping(){

    const messages = document.getElementById("messages")

    const div = document.createElement("div")

    div.className = "msg bot"

    div.id = "typing"

    div.innerHTML = `
        <div class="bubble">
            MindAnchor is typing...
        </div>
    `

    messages.appendChild(div)

}

function hideTyping(){

    const typing = document.getElementById("typing")

    if(typing){

        typing.remove()

    }

}

async function sendMessage(){

    const input = document.getElementById("user-input")

    const text = input.value.trim()

    if(text === "") return

    addMessage("user", text)

    input.value = ""

    showTyping()

    try{

        const response = await fetch("/api/chat", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })

        })

        const data = await response.json()

        hideTyping()

        if(data.error){

            addMessage("bot", "Error: " + data.error)

        }else{

            addMessage("bot", data.reply)

            loadSidebarHistory()

        }

    }catch(error){

        hideTyping()

        addMessage("bot", "Network error")

    }

}

document.getElementById("user-input").addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        sendMessage()

    }

})

async function loadHistory(){

    try{

        const response = await fetch("/api/history")

        const history = await response.json()

        history.forEach(chat => {

            addMessage("user", chat.user)

            addMessage("bot", chat.bot)

        })

    }catch(error){

        console.log(error)

    }

}

async function loadSidebarHistory(){

    try{

        const response = await fetch("/api/history")

        const history = await response.json()

        const historyList = document.getElementById("history-list")

        historyList.innerHTML = ""

        history.reverse().forEach((chat, index) => {

            const div = document.createElement("div")

            div.className = "history-item"

            div.innerHTML = `
                <strong>Chat ${index + 1}</strong><br>
                ${chat.user.substring(0, 40)}
            `

            div.onclick = () => {

                document.getElementById("messages").innerHTML = ""

                addMessage("user", chat.user)

                addMessage("bot", chat.bot)

            }

            historyList.appendChild(div)

        })

    }catch(error){

        console.log(error)

    }

}

function newChat(){

    document.getElementById("messages").innerHTML = ""

    addMessage(
        "bot",
        "New chat started 🌸"
    )

}

window.onload = () => {

    loadHistory()

    loadSidebarHistory()

}

</script>

</body>
</html>
