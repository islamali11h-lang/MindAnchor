<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - MindAnchor</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; }
.box { background:#161b22; padding:40px; border-radius:15px; width:380px; border:1px solid #333; }
h2 { text-align:center; margin-bottom:25px; font-size:24px; }
.anchor { text-align:center; font-size:40px; margin-bottom:10px; }
input { width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #333; background:#21262d; color:white; font-size:15px; }
button { width:100%; padding:12px; background:#238636; border:none; border-radius:8px; color:white; font-size:16px; cursor:pointer; }
button:hover { opacity:0.9; }
.error { background:#3d1a1a; color:#ff6b6b; padding:10px; border-radius:8px; margin-bottom:15px; text-align:center; }
.link { text-align:center; margin-top:15px; color:#8b949e; }
.link a { color:#238636; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <div class="anchor">⚓</div>
  <h2>Create Account</h2>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>
  <div class="link">
    Pehle se account hai? <a href="/login">Login</a>
  </div>
</div>
</body>
</html>
